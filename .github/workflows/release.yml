name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: linux,  goarch: arm   }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: build
        run: |
          NAME="lanzougo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go vet ./...
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w" -o "dist/$NAME" main.go
          cd dist && sha256sum "$NAME" > "$NAME.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
